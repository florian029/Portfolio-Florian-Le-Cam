<title>Florian Le Cam — Portfolio</title>
<style>
:root{--paper:#f4efe5;--ink:#22251f;--muted:#686b63;--olive:#687257;--line:#d9d1c2;--white:#fbf9f4}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}a{color:inherit;text-decoration:none}
input.tab{position:fixed;opacity:0;pointer-events:none}
.site-header{position:sticky;top:0;z-index:20;background:#f4efe5f2;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
.nav{max-width:1180px;margin:auto;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{font-weight:700;letter-spacing:.05em;white-space:nowrap}.navlinks{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.navlinks label,.nav-cv{cursor:pointer;padding:9px 11px;border-radius:999px;color:var(--muted);font-size:14px}.navlinks label:hover,.nav-cv:hover{background:var(--white);color:var(--ink)}.nav-cv{display:inline-flex;align-items:center;justify-content:center;font-weight:600}
#tab-home:checked~.site-header label[for=tab-home],#tab-about:checked~.site-header label[for=tab-about],#tab-exp:checked~.site-header label[for=tab-exp],#tab-form:checked~.site-header label[for=tab-form],#tab-skills:checked~.site-header label[for=tab-skills],#tab-projects:checked~.site-header label[for=tab-projects],#tab-universe:checked~.site-header label[for=tab-universe],#tab-contact:checked~.site-header label[for=tab-contact]{background:var(--ink);color:var(--paper)}
main{max-width:1180px;margin:auto}.page{display:none;min-height:calc(100vh - 75px);padding:70px 28px 90px}#tab-home:checked~main .page-home,#tab-about:checked~main .page-about,#tab-exp:checked~main .page-exp,#tab-form:checked~main .page-form,#tab-skills:checked~main .page-skills,#tab-projects:checked~main .page-projects,#tab-universe:checked~main .page-universe,#tab-contact:checked~main .page-contact{display:block}
.hero{min-height:calc(100vh - 150px);display:grid;grid-template-columns:1.1fr .9fr;gap:60px;align-items:center}.hero-copy{max-width:680px}.kicker,.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:var(--olive);font-weight:700}h1,h2,h3{font-family:Georgia,serif;font-weight:500}h1{font-size:clamp(58px,8vw,108px);line-height:.9;margin:18px 0 26px}h2{font-size:clamp(42px,5vw,64px);margin:0 0 16px}h3{font-size:29px;margin:10px 0 12px}.lead{font-size:19px;line-height:1.7;color:var(--muted);max-width:690px}.hero-photo{justify-self:end;width:min(420px,100%);aspect-ratio:4/5;overflow:hidden;border-radius:24px;background:var(--white);border:1px solid var(--line);box-shadow:0 22px 60px #22251f18}.hero-photo img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 18px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer}.btn.secondary{background:transparent;color:var(--ink);border-color:var(--line)}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:30px;margin-bottom:34px}.section-head p{max-width:540px;color:var(--muted);line-height:1.65;margin:0}


/* Mise en page des pages */
.page{padding-top:58px}
.section-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,440px);align-items:end;gap:70px;margin-bottom:42px}
.section-head>div{min-width:0}
.section-head p{max-width:none;margin:0;color:var(--muted);line-height:1.7}
.timeline{max-width:980px;margin:0 auto;display:grid;gap:0;border-top:1px solid var(--line)}
.timeline-item{padding:24px 0;border-bottom:1px solid var(--line)}
.timeline-item summary{list-style:none;cursor:pointer;position:relative;padding-right:35px}
.timeline-item summary::-webkit-details-marker{display:none}
.timeline-item summary:after{content:'+';position:absolute;right:0;top:3px;font-size:22px;color:var(--muted)}
.timeline-item[open] summary:after{content:'−'}
.timeline-item .level{display:block;text-transform:uppercase;letter-spacing:.14em;font-size:11px;color:var(--olive);font-weight:700;margin-bottom:7px}
.timeline-item h3{font-size:30px;margin:0 0 8px}
.timeline-item .meta{margin:0;color:var(--muted);line-height:1.6}
.timeline-item summary .tag{display:inline-block;margin-top:12px;font-size:12px;color:var(--ink)}
.timeline-item>p.meta{padding:15px 0 2px 0;max-width:760px}
.skills{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:34px}
.skill{background:var(--paper);padding:30px 28px;min-height:190px}
.skill.is-hidden{display:none!important}
.skills-filter-button{display:inline-flex;align-items:center;justify-content:center;min-height:34px;border:1px solid var(--line);padding:9px 14px;border-radius:999px;color:var(--muted);cursor:pointer;background:rgba(251,249,244,.38);font:600 12px Arial,Helvetica,sans-serif;line-height:1;transition:background .18s ease,color .18s ease,border-color .18s ease,transform .18s ease,box-shadow .18s ease}
.skills-filter-button:hover{background:var(--white);color:var(--ink);border-color:#c8c0b0;transform:translateY(-1px)}
.skills-filter-button.is-active{background:var(--ink);border-color:var(--ink);color:var(--paper);box-shadow:0 5px 14px rgba(34,37,31,.10)}
.skills-filter-button:focus-visible{outline:3px solid var(--olive);outline-offset:2px}
.skill .eyebrow{margin-bottom:10px}
.skill h3{font-size:30px;margin:0 0 12px}
.skill p{color:var(--muted);line-height:1.65;margin:0;max-width:600px}
.page-skills>.actions{display:block;max-width:100%;margin-top:28px}
.contact-card{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:28px 30px;max-width:900px}
.page-contact .contact-card{margin-top:12px}
.contact-line{display:grid;grid-template-columns:170px 1fr;gap:20px;padding:16px 0;border-bottom:1px solid var(--line);align-items:start}
.contact-line:last-child{border-bottom:0}
.contact-line strong{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--olive)}
.contact-line p{margin:0;color:var(--muted);line-height:1.6}
.projects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.project{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:25px 26px;min-height:190px}
.project .eyebrow{margin-bottom:8px}
.project h3{font-size:28px;line-height:1.12;margin:0 0 18px}
.project details summary{cursor:pointer;color:var(--muted);font-size:13px}
.project details p{color:var(--muted);line-height:1.65;font-size:14px;margin:14px 0 0}
/* === Cartes projets : présentation verticale + verso détaillé === */
.project-cards{display:grid;grid-template-columns:1fr;gap:24px;margin-top:8px}
.project-flip-container{height:640px;perspective:1400px;min-width:0;position:relative}
.project-flip-container.project-bike-card{height:760px}
.project-flip-toggle{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.project-flip-card{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.2,.75,.2,1);cursor:pointer;outline:none}
.project-flip-toggle:checked + .project-flip-card{transform:rotateY(180deg)}
.project-face{position:absolute;inset:0;border-radius:20px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--white);box-shadow:0 15px 40px rgba(34,37,31,.10);border:1px solid var(--line)}
.project-front{padding:0;display:flex;flex-direction:column;justify-content:space-between}
.project-front-media{width:100%;height:270px;flex:0 0 270px;overflow:hidden;background:#ddd8cc}
.project-front-media img{display:block;width:100%;height:100%;object-fit:cover}
.project-front-content{padding:25px 34px 30px;display:flex;flex:1;flex-direction:column;justify-content:space-between}
.project-front-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.project-date{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);white-space:nowrap}
.project-front h3,.project-back h3{font-family:Georgia,"Times New Roman",serif;font-size:38px;font-weight:400;line-height:1.08;margin:12px 0 18px;max-width:850px}
.project-front p{color:var(--muted);line-height:1.7;font-size:16px;max-width:820px;margin:0}
.project-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.project-tags span{border:1px solid var(--line);border-radius:999px;padding:7px 11px;font-size:11px;color:var(--muted);background:rgba(244,239,229,.45)}
.project-discover,.project-return{font-size:12px;color:var(--muted)}
.project-discover span{display:inline-block;margin-left:4px}
.project-back{transform:rotateY(180deg);padding:28px 34px 24px;display:flex;flex-direction:column;justify-content:space-between;background:#ebe9e2}
.project-back-scroll{overflow:auto;padding-right:8px;scrollbar-width:thin;min-height:0;flex:1}
.project-back h3{font-size:32px;margin-bottom:20px}
.project-section{margin-top:17px;padding-top:14px;border-top:1px solid rgba(0,0,0,.10)}
.project-section strong,.project-source strong{display:block;margin-bottom:7px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--olive)}
.project-section p,.project-section li,.project-source p{color:#5f655f;line-height:1.65;font-size:14px;margin:0}
.project-section ul{margin:0;padding-left:20px}
.project-source{margin-top:17px;padding-top:14px;border-top:1px solid rgba(0,0,0,.10)}
.project-source-note{display:block;margin-top:7px;color:var(--muted);font-size:12px;font-style:italic}
.project-map-section{margin-top:20px}
.project-map{height:430px;border-radius:14px;overflow:hidden;border:1px solid rgba(0,0,0,.10);background:#dfe4e0}
.project-map-note{margin-top:8px!important;font-size:12px!important;color:var(--muted)!important}
.project-return{display:flex;justify-content:flex-end;padding-top:14px;flex:0 0 auto}
.project-flip-toggle:focus-visible + .project-flip-card .project-face{outline:3px solid var(--olive);outline-offset:-3px}

.universe-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}
.universe-card{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:28px}
.universe-card:first-child{grid-row:span 2}
.universe-card h3{font-size:30px;line-height:1.12;margin:8px 0 15px}
.universe-card p,.universe-card li{color:var(--muted);line-height:1.65}
.universe-card ul{margin:0;padding-left:20px}
footer{max-width:1180px;margin:0 auto;padding:20px 28px 28px;border-top:1px solid var(--line);display:flex;justify-content:space-between;color:var(--muted);font-size:11px;letter-spacing:.06em}
/* Filtres : même logique que la version v6, adaptée à la structure des cartes 3D */
.experience-filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 30px}
.exp-filter-radio{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.experience-filter-label{display:inline-flex;align-items:center;border:1px solid var(--line);padding:10px 15px;border-radius:999px;color:var(--muted);cursor:pointer;background:transparent;font-size:13px;line-height:1;transition:background .18s ease,color .18s ease,border-color .18s ease}
.experience-filter-label:hover{background:var(--white);color:var(--ink);border-color:#c8c0b0}
#exp-filter-all:checked + .experience-filter-label,
#exp-filter-stage:checked + .experience-filter-label,
#exp-filter-job:checked + .experience-filter-label,
#exp-filter-benevolat:checked + .experience-filter-label{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.page-exp:has(#exp-filter-stage:checked) .flip-cards .flip-card-container:not([data-cat="stage"]),
.page-exp:has(#exp-filter-job:checked) .flip-cards .flip-card-container:not([data-cat="job"]),
.page-exp:has(#exp-filter-benevolat:checked) .flip-cards .flip-card-container:not([data-cat="benevolat"]){display:none!important}

/* === V34 : refonte de la vignette Voyages + corrections Mon univers === */
.universe-intro{margin-bottom:34px}
.universe-intro>div{max-width:760px}
.universe-grid{grid-template-columns:1fr 1fr;align-items:stretch}
.universe-card{padding:30px}
.universe-travel{grid-column:1 / -1;grid-row:auto;overflow:hidden;background:linear-gradient(135deg,var(--white) 0%,#f3f0e8 100%)}
.travel-layout{display:grid;grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr);gap:44px;align-items:start}
.travel-copy h3{font-size:38px;max-width:540px;margin:6px 0 16px}
.travel-copy p{max-width:600px;margin-bottom:24px}
.travel-regions{display:flex;gap:8px;flex-wrap:wrap}
.travel-regions span{border:1px solid var(--line);border-radius:999px;padding:8px 11px;font-size:11px;color:var(--muted);background:rgba(255,255,255,.62)}
.travel-destinations{border-left:1px solid var(--line);padding-left:30px}
.travel-destinations-label{text-transform:uppercase;letter-spacing:.12em;font-size:10px;font-weight:700;color:var(--olive);margin-bottom:14px}
.travel-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.travel-list span{display:block;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:12px;color:var(--muted);background:rgba(255,255,255,.55)}
.travel-list .next-trip{border-color:var(--olive);color:var(--ink);background:rgba(117,123,89,.08)}
.universe-sailing,.universe-sport,.universe-curiosity{min-height:0;align-self:start}
@media(max-width:900px){.travel-layout{grid-template-columns:1fr;gap:28px}.travel-destinations{border-left:0;border-top:1px solid var(--line);padding-left:0;padding-top:24px}.travel-list{grid-template-columns:1fr}}

@media(max-width:900px){.project-flip-container{height:680px}.project-flip-container.project-bike-card{height:800px}.project-front h3,.project-back h3{font-size:32px}.section-head{grid-template-columns:1fr;gap:12px;align-items:start}.projects,.universe-grid{grid-template-columns:1fr}.universe-card:first-child{grid-row:auto}.skills{grid-template-columns:1fr}.flip-cards{grid-template-columns:1fr;gap:18px}.flip-card-container{height:450px}.flip-photo{height:260px}.flip-content{padding:21px}.flip-back{padding:24px}.flip-content h3,.flip-back h3{font-size:27px}}
@media(max-width:600px){.navlinks .nav-cv{font-size:12px;padding:7px 8px}.project-flip-container{height:720px}.project-flip-container.project-bike-card{height:840px}.project-front-media{height:250px;flex-basis:250px}.project-front-content{padding:22px 24px 26px}.project-front,.project-back{padding:24px}.project-front-top{display:block}.project-date{display:block;margin-top:8px}.project-front h3,.project-back h3{font-size:28px}.project-map{height:340px}.page{padding:42px 20px 55px}.nav{padding:12px 18px;align-items:flex-start}.navlinks{gap:2px}.navlinks label{font-size:12px;padding:7px 8px}.section-head{margin-bottom:28px}.timeline-item h3,.skill h3,.project h3,.universe-card h3{font-size:25px}.contact-line{grid-template-columns:1fr;gap:6px}.contact-card{padding:20px}.hero{grid-template-columns:1fr;gap:30px}.hero-photo{justify-self:start;width:min(340px,100%)}footer{padding-left:20px;padding-right:20px}}
@media(prefers-reduced-motion:reduce){.flip-card{transition:none}}


/* === Corrections visuelles des cartes d'expériences === */
.flip-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;margin-top:8px}
.flip-card-container{height:450px;perspective:1400px;min-width:0;position:relative}
.flip-card-toggle{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.flip-card{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.2,.75,.2,1);cursor:pointer;outline:none}
.flip-card-toggle:checked + .flip-card{transform:rotateY(180deg)}
.flip-face{position:absolute;inset:0;border-radius:20px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--white);box-shadow:0 15px 40px rgba(34,37,31,.10)}
.flip-front{display:flex;flex-direction:column}
.flip-photo{display:block;width:100%;height:270px;object-fit:cover}
.flip-content{padding:24px 26px;flex:1;display:flex;flex-direction:column;justify-content:space-between}
.flip-category{color:var(--olive);text-transform:uppercase;letter-spacing:2px;font-size:10px;font-weight:700;margin-bottom:8px}
.flip-content h3,.flip-back h3{font-family:Georgia,"Times New Roman",serif;font-size:30px;font-weight:400;line-height:1.08;margin:0}
.flip-discover,.flip-return{font-size:12px;color:var(--muted)}
.flip-discover span{display:inline-block;margin-left:3px}
.flip-back{transform:rotateY(180deg);padding:30px;display:flex;flex-direction:column;justify-content:flex-start;background:#ebe9e2;overflow:hidden}
.flip-back h3{font-size:32px;margin:8px 0 18px;flex:0 0 auto}
.flip-back p{color:#5f655f;line-height:1.55;font-size:14px;margin:0}
.flip-back > div:first-child{min-height:0;overflow-y:auto;padding-right:7px;scrollbar-width:thin}.flip-info{margin-top:20px;padding-top:17px;border-top:1px solid rgba(0,0,0,.12)}
.flip-info>div{display:flex;gap:14px;margin-bottom:10px;font-size:13px}
.flip-info strong{min-width:68px;color:var(--olive);text-transform:uppercase;font-size:10px;letter-spacing:1px}
.flip-detail{margin-top:15px;padding-top:14px;border-top:1px solid rgba(0,0,0,.10)}
.flip-detail strong{display:block;margin-bottom:5px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--olive)}
.flip-back-bottom{display:flex;align-items:center;justify-content:flex-end;gap:12px;flex-wrap:wrap;margin-top:14px;flex:0 0 auto}
.flip-card-toggle:focus-visible + .flip-card .flip-face{outline:3px solid var(--olive);outline-offset:-3px}

/* === Filtres + finitions visuelles des expériences === */
.experience-filters{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:0 0 30px}
.exp-filter-radio{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.experience-filter-label{display:inline-flex;align-items:center;justify-content:center;min-height:34px;border:1px solid var(--line);padding:9px 14px;border-radius:999px;color:var(--muted);cursor:pointer;background:rgba(251,249,244,.38);font-size:12px;font-weight:600;letter-spacing:.01em;line-height:1;transition:background .18s ease,color .18s ease,border-color .18s ease,transform .18s ease,box-shadow .18s ease}
.experience-filter-label:hover{background:var(--white);color:var(--ink);border-color:#c8c0b0;transform:translateY(-1px)}
.experience-filter-label.is-active{background:var(--ink);border-color:var(--ink);color:var(--paper);box-shadow:0 5px 14px rgba(34,37,31,.10)}
.experience-filter-label:active{transform:translateY(0)}
.flip-card-container.is-hidden{display:none!important}
.flip-card-container{transition:transform .22s ease}
.flip-card-container:hover{transform:translateY(-3px)}
.flip-card-container:hover .flip-face{box-shadow:0 20px 46px rgba(34,37,31,.13)}
.flip-card-toggle:focus-visible + .flip-card{outline:2px solid var(--olive);outline-offset:4px;border-radius:20px}

/* === Formation : timeline + certifications + formations complémentaires === */
.formation-filters{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:0 0 42px}
.formation-filter-radio{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none;display:none}
.formation-filter-label{display:inline-flex;align-items:center;justify-content:center;min-height:34px;border:1px solid var(--line);padding:9px 14px;border-radius:999px;color:var(--muted);cursor:pointer;background:rgba(251,249,244,.38);font-size:12px;font-weight:600;line-height:1;transition:background .18s ease,color .18s ease,border-color .18s ease,transform .18s ease}
.formation-filter-label:hover{background:var(--white);color:var(--ink);border-color:#c8c0b0;transform:translateY(-1px)}
#form-filter-all:checked + .formation-filter-label,#form-filter-academic:checked + .formation-filter-label,#form-filter-cert:checked + .formation-filter-label,#form-filter-extra:checked + .formation-filter-label{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.formation-block{margin:0 0 68px}
.formation-block:last-of-type{margin-bottom:34px}
.formation-block-head{display:grid;grid-template-columns:minmax(0,.75fr) minmax(280px,1fr);gap:40px;align-items:end;margin:0 0 30px}
.formation-block-head .eyebrow{margin:0}
.formation-block-head p{margin:0;color:var(--muted);line-height:1.65;max-width:620px}
.timeline{position:relative;max-width:980px;margin:0 auto;padding-left:42px;display:block;border:0}
.timeline:before{content:"";position:absolute;left:12px;top:7px;bottom:7px;width:1px;background:var(--line)}
.timeline-item{position:relative;padding:0 0 38px;border:0;display:block}
.timeline-item:last-child{padding-bottom:0}
.timeline-item summary{list-style:none;cursor:pointer;padding:0;position:relative}
.timeline-item summary::-webkit-details-marker{display:none}
.timeline-item[open] summary{margin-bottom:12px}
.timeline-item:before{content:"";position:absolute;left:-35px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--olive);box-shadow:0 0 0 5px var(--paper);z-index:1}
.timeline-item .level{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:11px;letter-spacing:.06em;color:var(--muted);margin-bottom:10px}
